<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مدیریت مراکز</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header class="header">

        <h1>
            مدیریت مراکز و بیمارستان‌ها
        </h1>

        <p>
            برای مشاهده مراکز، استان موردنظر را انتخاب کنید.
        </p>

    </header>


    <!-- =========================
         Main
    ========================== -->

    <main class="container">

        <section class="card map-card">

            <h2>
                🗺️ نقشه ایران
            </h2>

            <p class="section-description">
                روی استان موردنظر کلیک کنید.
            </p>


            <!--
                نقشه ایران در این قسمت
                توسط JavaScript ساخته می‌شود.
            -->

            <div
                id="iranMap"
                class="iran-map"
            >

                <div class="map-loading">
                    در حال آماده‌سازی نقشه...
                </div>

            </div>

        </section>


        <!-- =========================
             نام استان انتخاب شده
        ========================== -->

        <section
            id="provincePage"
            class="card hidden"
        >

            <div class="page-toolbar">

                <button
                    type="button"
                    id="backToMapBtn"
                    class="btn btn-gray"
                >
                    ← بازگشت به نقشه
                </button>

                <h2 id="provinceTitle">
                    استان
                </h2>

            </div>


            <!-- =========================
                 لیست مراکز
            ========================== -->

            <div class="province-content">

                <h3>
                    🏥 مراکز این استان
                </h3>

                <div
                    id="centerList"
                    class="center-list"
                >

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
